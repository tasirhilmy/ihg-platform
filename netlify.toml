# IHG Platform - Netlify Configuration
# https://docs.netlify.com/integrations/frameworks/next-js/

[build]
  # Explicit prisma generate before next build (avoids postinstall network issues)
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Allow Prisma engine binary download on Netlify
  PRISMA_ENGINES_SKIP_DOWNLOAD = "false"
  PRISMA_SKIP_POSTINSTALL_GENERATE = "true"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js plugin (handles SSR, server actions, image optimization)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

